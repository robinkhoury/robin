<!DOCTYPE html>

<head>

<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #EDF1EE;
  --ink: #12231C;
  --muted: #5A6E64;
  --line: #C9D5CE;
  --accent: #1E6B4A;
  --on-accent: #F3FAF6;
  --card: #F8FAF8;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E1914; --ink: #E6F0EA; --muted: #93A89C; --line: #24382E;
    --accent: #58C793; --on-accent: #06180F; --card: #14241C;
  }
}
:root[data-theme="dark"] {
  --bg: #0E1914; --ink: #E6F0EA; --muted: #93A89C; --line: #24382E;
  --accent: #58C793; --on-accent: #06180F; --card: #14241C;
}
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
*, *::before, *::after { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font-family: "DM Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  font-size: 16px; line-height: 1.5; min-height: 100vh;
}
main { max-width: 460px; margin: 0 auto; padding: 56px 22px 40px; }
h1 {
  font-family: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  font-weight: 800; font-size: clamp(56px, 19vw, 84px);
  line-height: .95; letter-spacing: -0.03em; margin: 0;
}
.where {
  display: flex; align-items: center; gap: 8px;
  margin: 18px 0 40px; color: var(--muted); font-weight: 500;
}
svg { width: 22px; height: 22px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
.where svg { width: 18px; height: 18px; }
.links { display: grid; gap: 12px; }
.row {
  display: flex; align-items: center; gap: 16px;
  padding: 16px 18px; border-radius: 18px; text-decoration: none; color: var(--ink);
  background: var(--card); border: 1.5px solid var(--line);
  transition: transform .15s ease, border-color .15s ease;
}
.row:hover { border-color: var(--accent); }
.row:active { transform: scale(.98); }
.row:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
.row .ic {
  width: 44px; height: 44px; border-radius: 50%; flex: none;
  display: grid; place-items: center; background: var(--bg); color: var(--accent);
}
.row b { display: block; font-weight: 600; font-size: 17px; line-height: 1.25; }
.row span { display: block; color: var(--muted); font-size: 14px; overflow-wrap: anywhere; }
.row.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); padding: 20px 18px; }
.row.primary .ic { background: rgba(255,255,255,.18); color: var(--on-accent); }
.row.primary span { color: var(--on-accent); opacity: .85; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }

/* Small phones */
@media (max-width: 360px) {
  main { padding: 40px 16px 32px; }
  .row { padding: 14px; gap: 12px; }
  .row.primary { padding: 16px 14px; }
  .row b { font-size: 16px; }
}

/* Tablets and laptops: name on the left, links on the right */
@media (min-width: 760px) {
  main {
    max-width: 1000px; min-height: 100vh; padding: 48px 40px;
    display: grid; grid-template-columns: 1fr 1fr; gap: 72px; align-items: center;
  }
  h1 { font-size: clamp(84px, 10vw, 128px); }
  .where { margin: 24px 0 0; font-size: 18px; }
  .links { gap: 14px; }
}

/* Short landscape phones */
@media (max-height: 480px) and (orientation: landscape) {
  main { padding-top: 24px; padding-bottom: 24px; }
  h1 { font-size: 56px; }
  .where { margin-bottom: 20px; }
}
</style>
</head>
